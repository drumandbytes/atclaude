[package]
name = "atclaude"
version = "0.1.0"
edition = "2021"
description = "Inline shell companion for Claude Code with encrypted, searchable history"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive", "env"] }
directories = "6.0.0"
getrandom = "0.4.3"
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
serde_json = "1.0.154"
toml = "1.2.1"

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }
