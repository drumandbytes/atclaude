[package]
name = "atclaude"
version = "0.1.0"
edition = "2024"
description = "Inline shell companion for Claude Code with encrypted, searchable history"
license = "MIT"
repository = "https://github.com/drumandbytes/atclaude"
homepage = "https://atclaude.drumandbytes.dev"
readme = "README.md"

[profile.release]
strip = true

[dependencies]
anyhow = "1.0.104"
bip39 = "3.0.0"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
clap = { version = "4", features = ["derive", "env"] }
directories = "6.0.0"
getrandom = "0.4.3"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde_json = "1.0.154"
toml = "1.2.1"
ureq = { version = "3.5.2", features = ["json"] }
zstd = "0.14.4"

[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }
